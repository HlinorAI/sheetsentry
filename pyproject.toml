[project]
name = "sheetsentry"
version = "0.1.0"
description = "Checks and code review for .xlsx: catches the breakage that stops imports and quietly corrupts calculations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["excel", "xlsx", "spreadsheet", "validation", "linter", "data-quality", "ci"]

# One dependency, on purpose. A tool that installs in two seconds and drags
# nothing along gets tried. Everything else comes from the standard library.
dependencies = ["openpyxl>=3.1"]

[project.scripts]
sheetsentry = "sheetsentry.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetsentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests find the package directly in src and do not depend on an editable
# install. On macOS the editable .pth file can end up with the hidden flag,
# and CPython 3.11+ silently skips hidden .pth files: the install 'succeeds'
# while the import does not work.
pythonpath = ["src"]
